<script>
let globalRosterCache = [];
let contextPayload = null;
let verifiedStaffEmail = "";
let currentSystemIsDemoMode = false;
const DEPLOYED_BASE_URL = '<?!= deployedUrl ?>';

function navigateToApp(appName) {
    const currentApp = '<?!= currentAppName ?>' || 'eval';
    sessionStorage.setItem('kemp_suite_previous_app', currentApp);

    const baseUrl = DEPLOYED_BASE_URL || window.top.location.href.split('?')[0];
    let url = baseUrl + '?app=' + appName;
    const isDemoMode = localStorage.getItem('kemp_suite_verified_demo_mode') === 'true';
    if (isDemoMode) url += '&demo=true';
    window.top.location.href = url;
}

function goBackInApp() {
    const previousApp = sessionStorage.getItem('kemp_suite_previous_app') || 'eval';
    navigateToApp(previousApp);
}
// ========== AUTH ==========
(function() {
    // Check if already authenticated via Performance Engine cache
    const cachedEmail = localStorage.getItem('kemp_suite_verified_session_email');
    if (cachedEmail) {
        verifiedStaffEmail = cachedEmail;
        currentSystemIsDemoMode = localStorage.getItem('kemp_suite_verified_demo_mode') === 'true';
        document.getElementById('simpleAuthGate').remove();
        initAttendanceApp();
        return;
    }
    
    // No cache — show login
    google.script.run
        .withSuccessHandler(handleRosterLoad)
        .withFailureHandler(handleFault)
        .fetchAuthorizedApplicationProfiles("attendance");
})();
function handleRosterLoad(users) {
    document.getElementById('authLocalSpinner').style.display = "none";
    document.getElementById('authFormWrapper').style.display = "block";
    globalRosterCache = users || [];
    const dropdown = document.getElementById('authCoachDropdown');
    dropdown.innerHTML = '<option value="">-- Select Your Email --</option>';
    globalRosterCache.forEach(function(u) {
        if (u.email) {
            const opt = document.createElement('option');
            opt.value = u.email;
            opt.textContent = u.email;
            dropdown.appendChild(opt);
        }
    });
}

function evaluateSelectedProfileSecurityState() {
    const email = document.getElementById('authCoachDropdown').value;
    const block = document.getElementById('authInteractionBlock');
    const regWrapper = document.getElementById('authRegistrationFieldsWrapper');
    const label = document.getElementById('authPrimaryLabel');
    const btn = document.getElementById('authSubmitActionBtn');
    document.getElementById('authErrorAlert').style.display = "none";
    if (!email) { block.style.display = "none"; return; }
    const user = globalRosterCache.find(u => u.email === email);
    if (!user) { block.style.display = "none"; return; }
    block.style.display = "block";
    if (user.hasPassword === false) {
        label.textContent = "Create Access Password";
        regWrapper.style.display = "block";
        btn.textContent = "🔐 Register Profile";
    } else {
        label.textContent = "Enter Your Password";
        regWrapper.style.display = "none";
        btn.textContent = "🔓 Verify";
    }
}

function processIdentityVerificationSubmission() {
    const email = document.getElementById('authCoachDropdown').value;
    const pass = document.getElementById('authPrimaryPassword').value.trim();
    document.getElementById('authErrorAlert').style.display = "none";
    if (!email) return;
    const user = globalRosterCache.find(u => u.email === email);
    if (!user) return;
    if (user.hasPassword === false) {
        const confirm = document.getElementById('authConfirmPassword').value.trim();
        if (!pass || !confirm) { showError("Password fields cannot be blank."); return; }
        if (pass !== confirm) { showError("Passwords do not match."); return; }
        toggleBtn(true, "Registering...");
        google.script.run.withSuccessHandler(handleAuthResponse).withFailureHandler(handleFault).commitNewUserPasswordCredential(email, pass);
    } else {
        if (!pass) { showError("Please enter your password."); return; }
        toggleBtn(true, "Verifying...");
        google.script.run.withSuccessHandler(handleAuthResponse).withFailureHandler(handleFault).validateExistingUserCredentials(email, pass);
    }
}

function handleAuthResponse(result) {
    toggleBtn(false);
    if (result && result.isAuthenticated) {
        verifiedStaffEmail = result.verifiedEmail;
        localStorage.setItem('kemp_suite_verified_session_email', verifiedStaffEmail);
        document.getElementById('simpleAuthGate').remove();
        initAttendanceApp();
    } else {
        showError(result ? result.errorMessage : "Access denied.");
    }
}

function toggleBtn(loading, text = "") {
    const btn = document.getElementById('authSubmitActionBtn');
    btn.disabled = loading;
    btn.style.opacity = loading ? "0.6" : "1";
    if (text) btn.textContent = text;
    else evaluateSelectedProfileSecurityState();
}

function showError(msg) {
    const el = document.getElementById('authErrorAlert');
    el.innerText = msg;
    el.style.display = "block";
}

function handleFault(err) {
    toggleBtn(false);
    showError("Connection error: " + err.toString());
}

// ========== APP INIT ==========
function initAttendanceApp() {
    document.getElementById('loggedInStaff').innerText = verifiedStaffEmail;
    document.getElementById('loggedInStaffModule').innerText = verifiedStaffEmail;

    // Set today's date
    const today = new Date().toISOString().split('T')[0];
    document.getElementById('attendanceDate').value = today;

// Load context
   google.script.run
    .withSuccessHandler(function(ctx) {
        contextPayload = ctx;
        populateCenters();
        if (ctx.isAdmin) {
            document.getElementById("adminSandboxTray").style.display = "block";
        }
        applyAttendancePermissions(ctx.permissions || {});
    })
        .withFailureHandler(function() {
            alert("Failed to load data. Please refresh.");
        })
        .getPerformanceEngineContext(currentSystemIsDemoMode, verifiedStaffEmail);
}

// Student Attendance is restricted to Admin/Administrative Manager/coaching field staff.
// Staff Attendance (marking your own check-in) stays open to everyone — no gating needed there.
function applyAttendancePermissions(permissions) {
    const canActOnStudents = !!permissions.canTakeStudentAttendance;

    const studentSubmitBtn = document.querySelector('#module_student .btn-commit');

    if (!canActOnStudents) {
        if (studentSubmitBtn) { studentSubmitBtn.disabled = true; studentSubmitBtn.style.opacity = '0.5'; studentSubmitBtn.title = 'You do not have permission to take student attendance.'; }

        const notice = document.createElement('div');
        notice.style.cssText = 'text-align:center; padding:10px; color:#64748b; font-size:13px; background:#f8fafc; border:1px solid #e2e8f0; border-radius:8px; margin-bottom:16px;';
        notice.innerText = '🔒 You have view-only access to Student Attendance. You cannot record student attendance.';
        document.getElementById('module_student').insertBefore(notice, document.getElementById('module_student').firstChild);
    }
}

function toggleDemoSandboxMode() {
    currentSystemIsDemoMode = !currentSystemIsDemoMode;
    const btn = document.getElementById('sandboxToggleBtn');
    const tray = document.getElementById('adminSandboxTray');
    if (currentSystemIsDemoMode) {
        btn.innerText = "🧪 Demo Sandbox Mode ACTIVE (Tap to Return to Normal Use)";
        tray.style.background = "#fef3c7";
        tray.style.borderTopColor = "#f59e0b";
        btn.style.color = "#92400e";
        alert("🧪 Demo Sandbox Mode Activated — you are now viewing demo data only.");
    } else {
        btn.innerText = "🔒 Normal Use Mode (Tap to Change to Demo Sandbox)";
        tray.style.background = "#f8fafc";
        tray.style.borderTopColor = "#cbd5e1";
        btn.style.color = "#94a3b8";
    }
    initAttendanceApp();
}
// ========== MODULE SWITCH ==========
// Switches between the Student Attendance and Staff Attendance modules.
function switchModule(module) {
    document.querySelectorAll('.hub-card').forEach(c => c.classList.remove('active-hub'));
    document.getElementById('hub_' + module).classList.add('active-hub');
    document.getElementById('module_student').style.display = module === 'student' ? 'block' : 'none';
    document.getElementById('module_staff').style.display = module === 'staff' ? 'block' : 'none';
}

// Loads the academy centers into the Center dropdown.
function populateCenters() {
    const sel = document.getElementById('centerSelect');
    sel.innerHTML = '<option value="">-- Select Center --</option>';
    if (contextPayload && contextPayload.facilities) {
        contextPayload.facilities.forEach(c => {
            sel.innerHTML += `<option value="${c.Center_ID}">${c.Center_Name}</option>`;
        });
    }
    populateReportCenters();
}

//Loads the batches into the dropdown
function loadBatches() {
    const centerVal = document.getElementById('centerSelect').value;
    const batchSel = document.getElementById('batchSelect');
    batchSel.innerHTML = '<option value="">-- Select Batch --</option>';
    document.getElementById('rosterGridContainer').style.display = 'none';
    if (!centerVal || !contextPayload) return;
    contextPayload.batches.filter(b => b.Center_ID === centerVal).forEach(b => {
        batchSel.innerHTML += `<option value="${b.Batch_ID}">${b.Batch_Name}</option>`;
    });
}

// Loads the active students for the selected center and batch.
function loadStudentRoster() {
    const centerVal = document.getElementById('centerSelect').value;
    const batchVal = document.getElementById('batchSelect').value;
    if (!centerVal || !batchVal || !contextPayload) return;

    document.getElementById('rosterLoadingMsg').style.display = 'block';
    document.getElementById('rosterGridContainer').style.display = 'none';

    const students = contextPayload.players.filter(p =>
        p.Academy_Center_ID === centerVal &&
        p.Academy_Batch_ID === batchVal &&
        p.Status === "Active"
    );

    buildRosterGrid(students);
}
// Builds and displays the student attendance roster.

function buildRosterGrid(students) {
    document.getElementById('rosterLoadingMsg').style.display = 'none';
    const canAct = !!(contextPayload && contextPayload.permissions && contextPayload.permissions.canTakeStudentAttendance);
    const disabledAttr = canAct ? '' : 'disabled style="opacity:0.4; cursor:not-allowed;"';

    if (students.length === 0) {
        document.getElementById('rosterGrid').innerHTML = '<div style="text-align:center; padding:20px; color:#64748b;">No active students found for this batch.</div>';
        document.getElementById('rosterGridContainer').style.display = 'block';
        return;
    }

    let html = '';
    students.forEach(s => {
        html += `
        <div style="display: flex; align-items: center; justify-content: space-between; padding: 12px; background: white; border: 1px solid #e2e8f0; border-radius: 10px; margin-bottom: 8px;">
            <div>
                <div style="font-weight: 700; font-size: 14px; color: #1e293b;">${s.First_Name} ${s.Last_Name}</div>
                <div style="font-size: 12px; color: #64748b;">${s.Student_ID}</div>
            </div>
            <div style="display: flex; gap: 6px;">
                <button ${disabledAttr} onclick="setStatus('${s.Student_ID}', 'Present', this)" 
                    style="padding: 8px 12px; border-radius: 8px; border: 2px solid #16a34a; background: #16a34a; color: white; font-weight: 700; font-size: 13px; cursor: pointer;">P</button>
                <button ${disabledAttr} onclick="setStatus('${s.Student_ID}', 'Absent', this)" 
                    style="padding: 8px 12px; border-radius: 8px; border: 2px solid #cbd5e1; background: white; color: #64748b; font-weight: 700; font-size: 13px; cursor: pointer;">A</button>
                <button ${disabledAttr} onclick="setStatus('${s.Student_ID}', 'Injured', this)" 
                    style="padding: 8px 12px; border-radius: 8px; border: 2px solid #cbd5e1; background: white; color: #64748b; font-weight: 700; font-size: 13px; cursor: pointer;">I</button>
            </div>
        </div>`;
    });

    document.getElementById('rosterGrid').innerHTML = html;
    document.getElementById('rosterGridContainer').style.display = 'block';
}

function setStatus(studentId, status, clickedBtn) {
    const row = clickedBtn.parentElement;
    const buttons = row.querySelectorAll('button');
    
    // Reset all buttons
    buttons.forEach(btn => {
        btn.style.background = 'white';
        btn.style.color = '#64748b';
        btn.style.borderColor = '#cbd5e1';
    });

    // Highlight selected
    const colors = { 'Present': '#16a34a', 'Absent': '#cc0000', 'Injured': '#d97706' };
    clickedBtn.style.background = colors[status];
    clickedBtn.style.color = 'white';
    clickedBtn.style.borderColor = colors[status];

    // Store status on parent row
    row.setAttribute('data-student-id', studentId);
    row.setAttribute('data-status', status);
}

// Collects the attendance records and submits them to the backend.
function submitAttendance() {
    const centerVal = document.getElementById('centerSelect').value;
    const batchVal = document.getElementById('batchSelect').value;
    const dateVal = document.getElementById('attendanceDate').value;

    if (!centerVal || !batchVal) { alert("Please select Center and Batch first."); return; }
    if (!dateVal) { alert("Please select an attendance date."); return; }

    const rows = document.querySelectorAll('#rosterGrid > div');
    const attendanceRecords = [];

    rows.forEach(row => {
        const studentId = row.querySelector('[data-student-id]') ? 
            row.querySelector('[data-student-id]').getAttribute('data-student-id') : 
            row.getAttribute('data-student-id');
        const status = row.getAttribute('data-status') || 'Present'; // Default Present
        if (studentId) {
            attendanceRecords.push({
                studentId: studentId,
                status: status,
                centerId: centerVal,
                batchId: batchVal,
                date: dateVal,
                loggedBy: verifiedStaffEmail
            });
        }
    });

    if (attendanceRecords.length === 0) { alert("No students found to submit."); return; }

    // Collect all from roster regardless of whether tapped
    const allStudents = contextPayload.players.filter(p =>
        p.Academy_Center_ID === centerVal &&
        p.Academy_Batch_ID === batchVal &&
        p.Status === "Active"
    );

    const finalRecords = allStudents.map(s => {
        const row = document.querySelector(`#rosterGrid > div [data-student-id="${s.Student_ID}"]`);
        let status = 'Present'; // default
        if (row) {
            const parentRow = row.closest('div[data-status]');
            if (parentRow) status = parentRow.getAttribute('data-status') || 'Present';
        }
        return {
            studentId: s.Student_ID,
            status: status,
            centerId: centerVal,
            batchId: batchVal,
            date: dateVal,

function markStaffAttendanceNow() {
    const btn = document.querySelector('#module_staff .master-action-btn.btn-commit');
    btn.disabled = true;
    btn.innerText = "📍 Checking your location...";

    function withGpsTimeout(callback) {
        var settled = false;
        var timer = setTimeout(function() {
            if (settled) return;
            settled = true;
            callback('', '');
        }, 8000);

        captureRealGpsCoordinates(function(lat, lon) {
            if (settled) return;
            settled = true;
            clearTimeout(timer);
            callback(lat, lon);
        });
    }

    fetch('https://ipapi.co/json/')
        .then(function(r) {
            if (!r.ok) throw new Error("IP lookup failed: " + r.status);
            return r.json();
        })
        .then(function(data) {
            withGpsTimeout(function(lat, lon) {
                if (!lat || !lon) {
                    btn.disabled = false;
                    btn.innerText = "📍 Mark Attendance Now";
                    alert("Unable to verify your location.\n\nPlease enable location access in your browser and try again.");
                    return;
                }
                finalizeMarkAttendance(data, lat, lon);
            });
        })
        .catch(function() {
            withGpsTimeout(function(lat, lon) {
                if (!lat || !lon) {
                    btn.disabled = false;
                    btn.innerText = "📍 Mark Attendance Now";
                    alert("Unable to verify your location.\n\nPlease enable location access in your browser and try again.");
                    return;
                }
                finalizeMarkAttendance({ ip: 'Unknown', city: 'Unknown', region: 'Unknown', org: '' }, lat, lon);
            });
        });
}


function finalizeMarkAttendance(data, gpsLat, gpsLon, gpsAccuracy) {
    const btn = document.querySelector('#module_staff .master-action-btn.btn-commit');
    btn.innerText = "Verifying & Logging...";

    google.script.run
        .withSuccessHandler(function(result) {
            btn.disabled = false;
            btn.innerText = "📍 Mark Attendance Now";
            if (result.success) {
                let msg = "Staff attendance marked successfully!";
                if (result.geofence && result.geofence.distanceMeters !== undefined) {
                    msg += "\n\nLocation verified ✓\nYou are " + result.geofence.distanceMeters + " meters from " + result.geofence.centerName + ".";
                }
                alert(msg);
            } else {
                let msg = "Location verification failed.\n\n" + result.error;
                alert(msg);
            }
        })
        .withFailureHandler(function() {
            btn.disabled = false;
            btn.innerText = "📍 Mark Attendance Now";
            alert("Connection failed.");
        })
        .submitStaffAttendance({
          email: verifiedStaffEmail,
          ip: data.ip,
          city: data.city,
          region: data.region,
          isp: data.org || '',
          latitude: gpsLat,
          longitude: gpsLon,
          accuracy: gpsAccuracy,
          actionType: 'Live_Net',
          isDemoMode: currentSystemIsDemoMode
        });
}
function captureRealGpsCoordinates(callback) {
    if (!navigator.geolocation) {
        callback('', '');
        return;
    }
    navigator.geolocation.getCurrentPosition(
        function(position) {
            callback(position.coords.latitude, position.coords.longitude);
        },
        function() {
            callback('', '');
        },
        { enableHighAccuracy: true, timeout: 10000 }
    );
}

function renderReportTable(records, centerVal, batchVal) {
    const centerName = (contextPayload.facilities.find(c => c.Center_ID === centerVal) || {}).Center_Name || centerVal;
    const monthVal = document.getElementById('reportMonth').value;
    const dateVal = document.getElementById('reportDate').value;
    const periodLabel = dateVal || monthVal || "";

    if (!records || records.length === 0) {
        const html = `<div style="margin-bottom:12px; font-size:14px;">
                <strong>Center:</strong> ${centerName} &nbsp;|&nbsp; <strong>Period:</strong> ${periodLabel}
            </div>
            <div style="text-align:center; padding:30px 20px; color:#64748b;">
                <div style="font-size:28px; margin-bottom:8px;">🗓️</div>
                <div style="font-weight:600; color:#475569;">No attendance recorded for this period</div>
                <div style="font-size:12px; margin-top:4px;">Try a different month or check back once attendance has been logged.</div>
            </div>`;
        document.getElementById('reportTableWrapper').innerHTML = html;
        document.getElementById('reportResultsContainer').style.display = 'block';
        lastReportData = null;
        lastReportMeta = { centerName, centerVal, periodLabel };
        return;
    }

    // Roster: every active student in scope, so 0-attendance students still show up
    const roster = contextPayload.players.filter(p =>
        p.Academy_Center_ID === centerVal &&
        p.Status === "Active" &&
        (!batchVal || p.Academy_Batch_ID === batchVal)
    );

    const batchNameLookup = {};
    contextPayload.batches.forEach(b => { batchNameLookup[b.Batch_ID] = b.Batch_Name; });

    const summary = {};
    roster.forEach(s => {
        summary[s.Student_ID] = {
            name: `${s.First_Name} ${s.Last_Name}`,
            batchId: s.Academy_Batch_ID,
            batchName: batchNameLookup[s.Academy_Batch_ID] || s.Academy_Batch_ID,
            Present: 0, Absent: 0, Injured: 0
        };
    });

    records.forEach(r => {
        if (!summary[r.studentId]) {
            summary[r.studentId] = {
                name: r.studentId + " (not in active roster)",
                batchId: r.batchId,
                batchName: batchNameLookup[r.batchId] || r.batchId,
                Present: 0, Absent: 0, Injured: 0
            };
        }
        if (summary[r.studentId][r.status] !== undefined) summary[r.studentId][r.status]++;
    });

    lastReportData = summary;
    lastReportMeta = { centerName, centerVal, periodLabel };

    // Group students by batch so "All Batches" is readable
    const byBatch = {};
    Object.keys(summary).forEach(id => {
        const s = summary[id];
        if (!byBatch[s.batchName]) byBatch[s.batchName] = [];
        byBatch[s.batchName].push(Object.assign({ id }, s));
    });

    let html = `<div style="margin-bottom:12px; font-size:14px;">
        <strong>Center:</strong> ${centerName} &nbsp;|&nbsp; <strong>Period:</strong> ${periodLabel}
    </div>`;

    Object.keys(byBatch).forEach(batchName => {
        html += `<div style="font-weight:700; margin:12px 0 6px; color:#1e293b;">Batch: ${batchName}</div>
        <table style="width:100%; border-collapse:collapse; font-size:13px; margin-bottom:8px;">
            <thead><tr style="background:#f1f5f9; text-align:left;">
                <th style="padding:8px; border-bottom:1px solid #e2e8f0;">Student</th>
                <th style="padding:8px; border-bottom:1px solid #e2e8f0;">Present</th>
                <th style="padding:8px; border-bottom:1px solid #e2e8f0;">Absent</th>
                <th style="padding:8px; border-bottom:1px solid #e2e8f0;">Injured</th>
                <th style="padding:8px; border-bottom:1px solid #e2e8f0;">Total Logged</th>
            </tr></thead><tbody>`;

        byBatch[batchName].forEach(s => {
            const total = s.Present + s.Absent + s.Injured;
            html += `<tr>
                <td style="padding:8px; border-bottom:1px solid #f1f5f9;">${s.name}<br><span style="color:#94a3b8; font-size:11px;">${s.id}</span></td>
                <td style="padding:8px; border-bottom:1px solid #f1f5f9;">${s.Present}</td>
                <td style="padding:8px; border-bottom:1px solid #f1f5f9;">${s.Absent}</td>
                <td style="padding:8px; border-bottom:1px solid #f1f5f9;">${s.Injured}</td>
                <td style="padding:8px; border-bottom:1px solid #f1f5f9;">${total}</td>
            </tr>`;
        });
        html += `</tbody></table>`;
    });

    document.getElementById('reportTableWrapper').innerHTML = html;
    document.getElementById('reportResultsContainer').style.display = 'block';
}
