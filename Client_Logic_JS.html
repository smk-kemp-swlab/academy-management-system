        document.getElementById('identityConfirmSyncBtn').disabled = true;

        document.getElementById('identityConfirmSyncBtn').innerText = "Syncing roster data...";
        document.getElementById('loadingSpinnerElement').style.display = "block";
        
        google.script.run
            .withSuccessHandler(function(context) {
                masterContextPayload = context;
                
                populateAccountSelectors();
                refreshActiveInstanceTabs();
                
                // 🌟 DAY 2 INITIALIZATION: Open Evaluations by default on sync success
                switchActivePortalWorkspace('evals');
                
                // Dynamically build scoring grids when the database drops in
                buildSupersetCardMatrix('technicalMetricsWrapper', techAttributes, 'tech', true);
                buildSupersetCardMatrix('tacticalMetricsWrapper', tacAttributes, 'tac', false);
                buildSupersetCardMatrix('physicalMetricsWrapper', physAttributes, 'phys', false);
                buildSupersetCardMatrix('psychologicalMetricsWrapper', psychAttributes, 'psych', false);

                    document.getElementById("adminSandboxTray").style.display = "block";
                }
                
                document.getElementById('evaluationConsolePanel').style.opacity = "1";
                document.getElementById('evaluationConsolePanel').style.pointerEvents = "auto";
                document.getElementById('loadingSpinnerElement').style.display = "none";

                document.getElementById('identityActionDeck').style.display = "none";

                alert("Database Mapping Error: Connection failed. Bypassing to standalone offline mode.");

            })

    function populateAccountSelectors() {
        if (!masterContextPayload) return;
        
        const coachSel = document.getElementById('evalCoachSelect');
        const currentCoachVal = coachSel.value;
        
        // 1. Rebuild options array safely
        coachSel.innerHTML = '<option value="">-- Choose Coach Identity --</option>';
        masterContextPayload.coaches.forEach(email => { 
            coachSel.innerHTML += `<option value="${email}">${email}</option>`; 
        });
        
        // 🌟 HARDENED SMART DEFAULTING STATE MACHINE
        if (currentCoachVal) {
            // Keep whatever the coach manually selected if they are mid-session
            coachSel.value = currentCoachVal;
        } 
        else {
            // Read from either the live trace or our hardened handshake cache
            const verifiedHandshakeEmail = localStorage.getItem('kemp_suite_verified_session_email');
            const fallbackTraceEmail = masterContextPayload.currentUserEmailTrace;
            const targetEmailToMatch = (verifiedHandshakeEmail || fallbackTraceEmail || "").trim().toLowerCase();

            if (targetEmailToMatch) {
                let matchedEmailInRegistry = "";

                // Scan options to see if we have a case-insensitive match in your registry array
                for (let i = 0; i < coachSel.options.length; i++) {
                    if (coachSel.options[i].value.trim().toLowerCase() === targetEmailToMatch) {
                        matchedEmailInRegistry = coachSel.options[i].value;
                        break;
                    }
                }

                // If found, explicitly lock onto the exact case-matched string
                if (matchedEmailInRegistry) {
                    coachSel.value = matchedEmailInRegistry;
                    // Also update the local storage rememberer for continuity
                    localStorage.setItem('kemp_suite_remembered_coach', matchedEmailInRegistry);
                } else {
                    const storedCoach = localStorage.getItem('kemp_suite_remembered_coach');
                    if (storedCoach && !coachSel.value) coachSel.value = storedCoach;
                }
            } else {
                const storedCoach = localStorage.getItem('kemp_suite_remembered_coach');
                if (storedCoach && !coachSel.value) coachSel.value = storedCoach;
            }
        }

        // 2. Rebuild facilities/centers selector safely
        const centerSel = document.getElementById('filterCenter');
        const currentCenterVal = centerSel.value;
        centerSel.innerHTML = '<option value="">-- Select Center --</option>';
        masterContextPayload.facilities.forEach(c => { centerSel.innerHTML += `<option value="${c.Center_ID}">${c.Center_Name}</option>`; });
        if (currentCenterVal) centerSel.value = currentCenterVal;
    }

    function toggleSectionVisibility(id, state) { document.getElementById(id).style.display = state; }
    
    function resetCascadingSelectors() { 
        document.getElementById('filterCenter').value = ""; 
        document.getElementById('filterBatch').innerHTML = '<option value="">-- Choose Center First --</option>'; 
    }

    function executeCascadingFilter() {
        if (!masterContextPayload) return;

        const centerVal = document.getElementById('filterCenter').value;
        const batchSel = document.getElementById('filterBatch');
        const playerLookup = document.getElementById('p_macro_student_lookup');

        if (!centerVal) {
            batchSel.innerHTML = '<option value="">-- Choose Center First --</option>';
            if (playerLookup) playerLookup.innerHTML = '<option value="">-- Select Center/Batch First --</option>';
            return;
        }

        const currentSelectedBatchVal = batchSel.value;
        batchSel.innerHTML = '<option value="">-- Select Batch --</option>';
        
        masterContextPayload.batches.filter(b => b.Center_ID === centerVal).forEach(b => {
            batchSel.innerHTML += `<option value="${b.Batch_ID}">${b.Batch_Name}</option>`;
        });

        if (currentSelectedBatchVal) batchSel.value = currentSelectedBatchVal;
        const finalBatchVal = batchSel.value;
        
        if (playerLookup) {
            if (!finalBatchVal) {
                playerLookup.innerHTML = '<option value="">-- Select Batch Next --</option>';
            } else {
                playerLookup.innerHTML = '<option value="">-- Choose Player --</option>';
                
                masterContextPayload.players.filter(p => p.Academy_Center_ID === centerVal && p.Academy_Batch_ID === finalBatchVal && p.Status === "Active").forEach(p => {
                    playerLookup.innerHTML += `<option value="${p.Student_ID}">${p.First_Name} ${p.Last_Name} (${p.Student_ID})</option>`;
                });
            }
        }
    }

                htmlPayload += '\n' +
                    '                    <div class="pressure-label">No Pressure Baseline</div>\n' +
                    '                    <div class="rating-matrix-row" data-column-field="' + prefix + '_' + cleanAttr + '_NoPressure">\n' +
                    '                        <div class="rate-cell" onclick="handleCellMetricsSelection(this, 1)">1</div>\n' +
                    '                        <div class="rate-cell" onclick="handleCellMetricsSelection(this, 2)">2</div>\n' +
                    '                        <div class="rate-cell" onclick="handleCellMetricsSelection(this, 3)">3</div>\n' +
                    '                        <div class="rate-cell" onclick="handleCellMetricsSelection(this, 4)">4</div>\n' +
                    '                        <div class="rate-cell" onclick="handleCellMetricsSelection(this, 5)">5</div>\n' +
                    '                    </div>\n' +
                    '                    <div class="pressure-label">Under Pressure Execution</div>\n' +
                    '                    <div class="rating-matrix-row" data-column-field="' + prefix + '_' + cleanAttr + '_UnderPressure">\n' +
                    '                        <div class="rate-cell" onclick="handleCellMetricsSelection(this, 1)">1</div>\n' +
                    '                        <div class="rate-cell" onclick="handleCellMetricsSelection(this, 2)">2</div>\n' +
                    '                        <div class="rate-cell" onclick="handleCellMetricsSelection(this, 3)">3</div>\n' +
                    '                        <div class="rate-cell" onclick="handleCellMetricsSelection(this, 4)">4</div>\n' +
                    '                        <div class="rate-cell" onclick="handleCellMetricsSelection(this, 5)">5</div>\n' +
                    '                    </div>';
            } else {
                htmlPayload += '\n' +
                    '                    <div class="rating-matrix-row" data-column-field="' + prefix + '_' + cleanAttr + '_Rating">\n' +
                    '                        <div class="rate-cell" onclick="handleCellMetricsSelection(this, 1)">1</div>\n' +
                    '                        <div class="rate-cell" onclick="handleCellMetricsSelection(this, 2)">2</div>\n' +
                    '                        <div class="rate-cell" onclick="handleCellMetricsSelection(this, 3)">3</div>\n' +
                    '                        <div class="rate-cell" onclick="handleCellMetricsSelection(this, 4)">4</div>\n' +
                    '                        <div class="rate-cell" onclick="handleCellMetricsSelection(this, 5)">5</div>\n' +
                    '                    </div>';
            }
            htmlPayload += `<input type="text" placeholder="Add specific execution notes..." data-notes-field="${prefix}_${cleanAttr}_Notes"></div>`;
            container.innerHTML += htmlPayload;
        });
    }

    function updateBadgeTrackerDisplay() {

    function processPlayerEvaluationCapture() {
        if (syncEngineLockFlag) return;

        const coachSel = document.getElementById('evalCoachSelect');
        const frameworkSel = document.getElementById('evalTypeFramework');
        const sessionTabSel = document.getElementById('evalSessionTabSelect');

        if(!coachSel.value) { alert("Please identify your Assessor Coach profile first."); return; }
        if(!sessionTabSel.value) { alert("Please select or create an active trial session sheet."); return; }

        let packet = {
            "Logged_Coach_Email": coachSel.value, "Evaluation_Type": frameworkSel.value, "Evaluation_Cycle_Tag": sessionTabSel.value,
            "TX_Signature_Token": "TX_EVAL_" + new Date().getTime() + "_" + Math.floor(Math.random() * 1000)
        };

        if(frameworkSel.value === "Trial") {
            // 🎛️ Check which data entry stream is currently selected
            const activeMethod = document.querySelector('input[name="entryMethod"]:checked').value;
            let playerName = "";
            let playerBib = "";

           if (activeMethod === "csv") {
            const csvSelector = document.getElementById('dynamicPlayerSelector');
            if(!csvSelector.value) { alert("Please select an uploaded player profile from the CSV dropdown."); return; }
            
            const parts = csvSelector.value.split('|');
            playerBib = parts[0] || "";
            playerName = parts[1] || "";
            } else {
                const manualNameEl = document.getElementById('manualPlayerName');
                const manualBibEl = document.getElementById('p_macro_bib');
                
                playerName = manualNameEl ? manualNameEl.value.trim() : "";
                playerBib = manualBibEl ? manualBibEl.value.trim() : "";
                
                if(!playerName || !playerBib) { alert("Player Name and Bib Number are mandatory for manual entry."); return; }
}

            // Bind values cleanly to the outgoing sync packet
            packet["Player_Name"] = playerName; 
            packet["Trial_Number_Or_Bib"] = playerBib;
            
            // Capture sub-profile metadata fields if they exist in the UI
            packet["Date_Of_Birth"] = document.getElementById('p_macro_dob') ? document.getElementById('p_macro_dob').value : "";
            packet["Preferred_Position"] = document.getElementById('p_macro_pos1') ? document.getElementById('p_macro_pos1').value : "";
            packet["Secondary_Position"] = document.getElementById('p_macro_pos2') ? document.getElementById('p_macro_pos2').value : "";
            packet["Dominant_Foot"] = document.getElementById('p_macro_foot') ? document.getElementById('p_macro_foot').value : "";
            packet["Previous_Club_Experience"] = document.getElementById('p_macro_exp') ? document.getElementById('p_macro_exp').value : "";
            packet["Contact_Number"] = document.getElementById('p_macro_phone') ? document.getElementById('p_macro_phone').value : "";
            packet["Injury_Notes"] = document.getElementById('p_macro_injury') ? document.getElementById('p_macro_injury').value : "";
        } else {
            if (frameworkSel.value === "Club") {
                const activeMethod = document.querySelector('input[name="entryMethod"]:checked');
                if (activeMethod && activeMethod.value === "csv") {
                    const csvSelector = document.getElementById('dynamicPlayerSelector');
                    if(!csvSelector.value) { alert("Please select a player from the CSV dropdown."); return; }
                    const parts = csvSelector.value.split('|');
                    packet["Trial_Number_Or_Bib"] = parts[0] || "";
                    packet["Player_Name"] = parts[1] || "";
                } else {
                    const manualNameEl = document.getElementById('manualPlayerName');
                    const manualBibEl = document.getElementById('p_macro_bib');
                    packet["Player_Name"] = manualNameEl ? manualNameEl.value.trim() : "";
                    packet["Trial_Number_Or_Bib"] = manualBibEl ? manualBibEl.value.trim() : "";
                    if(!packet["Player_Name"] || !packet["Trial_Number_Or_Bib"]) { alert("Player Name and Bib are mandatory."); return; }
                }
            } else {
                const lookupEl = document.getElementById('p_macro_student_lookup'); 
                if(!lookupEl.value) { alert("Roster assignment is mandatory."); return; }
                const rawText = lookupEl.options[lookupEl.selectedIndex].text;
                packet["Player_Name"] = rawText.replace(/\s*\(.*\)\s*$/, '').trim();
                packet["Trial_Number_Or_Bib"] = lookupEl.value;
            }
        }

        document.querySelectorAll('.rating-matrix-row').forEach(row => {
            const field = row.getAttribute('data-column-field'); const score = row.getAttribute('data-selected-score');
            if(row.parentElement.parentElement.style.display !== 'none') packet[field] = score ? parseInt(score, 10) : "";
        });
        document.querySelectorAll('input[data-notes-field]').forEach(input => {
            if(input.parentElement.parentElement.style.display !== 'none') packet[input.getAttribute('data-notes-field')] = input.value;
        });

        packet["Overall_Score"] = document.getElementById('out_overall_score').value;
        packet["Recommended_Action"] = document.getElementById('out_recommended_action').value;
        packet["Assessor_Name"] = document.getElementById('out_assessor_name').value;
        packet["Major_Strengths"] = document.getElementById('out_strengths').value;
        packet["Improvement_Areas"] = document.getElementById('out_improvements').value;
        packet["Final_Comments"] = document.getElementById('out_comments').value;
        packet["Assessment_Date"] = document.getElementById('out_assessment_date').value;
        if (!packet["Assessor_Name"] || packet["Assessor_Name"].trim() === "") {
    alert("Assessor Signature Name is mandatory. Please fill it before saving.");
    return;
}

        localTransmissionQueue.push({ 
            tab: sessionTabSel.value, 
            payload: packet, 
            txId: packet["TX_Signature_Token"],
            isDemo: currentSystemIsDemoMode 
        });
        localStorage.setItem('kemp_suite_eval_queue', JSON.stringify(localTransmissionQueue));
        updateBadgeTrackerDisplay();

        clearFormLayoutInterface(frameworkSel.value);
        executeNextQueueTransmission();
    }

function clearFormLayoutInterface(currentFramework) {
        if(currentFramework === "Trial") {
            ["p_macro_name", "p_macro_bib", "p_macro_dob", "p_macro_pos1", "p_macro_pos2", "p_macro_foot", "p_macro_exp", "p_macro_phone", "p_macro_injury"].forEach(id => {
                const el = document.getElementById(id); if (el) el.value = '';
            });
        } else {
            const lookup = document.getElementById('p_macro_student_lookup'); if (lookup) lookup.value = '';
            const card = document.getElementById('playerContextDataCard'); if (card) card.style.display = 'none';
        }
        document.querySelectorAll('.rating-matrix-row').forEach(row => {
            row.removeAttribute('data-selected-score'); row.querySelectorAll('.rate-cell').forEach(c => c.classList.remove('selected'));
        });
        document.querySelectorAll('input[data-notes-field]').forEach(input => input.value = '');
        ["out_overall_score", "out_recommended_action", "out_assessor_name", "out_strengths", "out_improvements", "out_comments"].forEach(id => {
            const el = document.getElementById(id); if (el) el.value = '';
        });
        window.scrollTo({top: 0, behavior: 'smooth'});
        switchFormWizardStepView(1);
    }
    function executeNextQueueTransmission() {
        if (localTransmissionQueue.length === 0) { syncEngineLockFlag = false; setFormFreezeLayoutState(false); return; }

        syncEngineLockFlag = true; setFormFreezeLayoutState(true);
        const targetPackage = localTransmissionQueue[0];

        if (typeof google !== 'undefined' && google.script && google.script.run) {
            google.script.run
                .withSuccessHandler(function(response) {
                    if (response.success) {
                        if (localTransmissionQueue.length > 0 && localTransmissionQueue[0].txId === response.transactionId) {
                            localTransmissionQueue.shift();
                            localStorage.setItem('kemp_suite_eval_queue', JSON.stringify(localTransmissionQueue));
                        }
                        updateBadgeTrackerDisplay(); executeNextQueueTransmission();
                    } else {
                        handleFallbackFailureState();
                    }
                })
                .withFailureHandler(function() { handleFallbackFailureState(); })
                .streamEvaluationToSpoke(targetPackage.payload, targetPackage.tab, targetPackage.txId, targetPackage.isDemo || false);
        } else {
            handleFallbackFailureState();
        }
    }

    function setFormFreezeLayoutState(freeze) {
        const btn = document.getElementById('commitFormBtn'); const syncBtn = document.getElementById('manualCloudSyncBtn');
        if(btn) { btn.innerText = freeze ? "Streaming To Cloud Ledger..." : "Save Player Evaluation"; btn.disabled = freeze; }
        if(syncBtn) syncBtn.disabled = freeze;
    }

    function handleFallbackFailureState() {
        syncEngineLockFlag = false; setFormFreezeLayoutState(false);
        alert("Saved safely to phone storage! Network reception is weak. Data will stream to cloud ledger when reception clears.");
    }

    function forceOfflineQueueTransmission() { if (!syncEngineLockFlag) executeNextQueueTransmission(); }

// ==========================================
// CSV Handling Core Functions
// ==========================================
function handleCsvUpload(event) {
    const file = event.target.files[0];
    if (!file) return;

    const manualInputPanel = document.getElementById('manualEntryStream');
    const dropdownContainer = document.getElementById('dynamicPlayerDropdownContainer');
    const playerSelector = document.getElementById('dynamicPlayerSelector');

    if (manualInputPanel) manualInputPanel.style.display = 'none';

    const reader = new FileReader();
    reader.onload = function(e) {
        const text = e.target.result;
        const rows = text.split('\n').map(r => r.trim()).filter(r => r.length > 0);

        if (rows.length === 0) return;

        const extractedPlayers = []; // { bib, name, group }

        for (let i = 1; i < rows.length; i++) {
            const cols = rows[i].split(',');
            const bib = cols[0] ? cols[0].replace(/^["']|["']$/g, '').trim() : '';
            const name = cols[1] ? cols[1].replace(/^["']|["']$/g, '').trim() : '';
            const group = cols[2] ? cols[2].replace(/^["']|["']$/g, '').trim() : 'Other';
            if (name) {
                extractedPlayers.push({ bib: bib, name: name, group: group });
            }
        }

        if (extractedPlayers.length > 0) {
            if (playerSelector) {
                playerSelector.innerHTML = '<option value="">-- Select a Player --</option>';

                const groups = {};
                extractedPlayers.forEach(p => {
                    if (!groups[p.group]) groups[p.group] = [];
                    groups[p.group].push(p);
                });

                Object.keys(groups).sort().forEach(grp => {
                    const optgroup = document.createElement('optgroup');
                    optgroup.label = grp;
                    groups[grp].forEach(p => {
                        const option = document.createElement('option');
                        option.value = p.bib + '|' + p.name; // store both, pipe-separated
                        option.textContent = p.name + (p.bib ? ' (Sl No: ' + p.bib + ')' : '');
                        optgroup.appendChild(option);
                    });
                    playerSelector.appendChild(optgroup);
                });
            }

            if (dropdownContainer) dropdownContainer.style.display = 'block';

        } else {
            alert('Could not read player names from column 2 of the CSV.');
            if (manualInputPanel) manualInputPanel.style.display = 'block';
        }
    };

    reader.readAsText(file);
}
/**
 * Helper to parse CSV text and extract values from a specific column header
 */
function parseCsvColumnByName(csvText, columnName) {
    const rows = csvText.split('\n').map(row => row.trim()).filter(row => row.length > 0);
    if (rows.length === 0) return [];

    // Parse headers and strip quotes cleanly
    const headers = rows[0].split(',').map(h => h.replace(/^["']|["']$/g, '').trim());
    const targetIndex = headers.indexOf(columnName);

    if (targetIndex === -1) return []; // Column not found

    const results = [];
    for (let i = 1; i < rows.length; i++) {
        const columns = rows[i].split(',');
        if (columns[targetIndex]) {
            const cleanValue = columns[targetIndex].replace(/^["']|["']$/g, '').trim();
            if (cleanValue) results.push(cleanValue);
        }
    }
    return results;
}

/**
 * Toggles between CSV Upload and Manual Data Entry views for both standard and trial scopes
 */

    const csvStream = document.getElementById('csvEntryStream');
    const manualStream = document.getElementById('manualEntryStream');

    } else {
        if (csvStream) csvStream.style.display = 'none';
        if (manualStream) manualStream.style.display = 'block';
        if (manualCard) { manualCard.style.borderColor = 'var(--primary)'; manualCard.style.background = '#fef2f2'; manualCard.style.color = 'var(--primary)'; }
        if (csvCard) { csvCard.style.borderColor = '#cbd5e1'; csvCard.style.background = 'white'; csvCard.style.color = '#64748b'; }
    }
}
