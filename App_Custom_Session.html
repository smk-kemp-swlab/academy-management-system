<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Custom Session Entry</title>
    <?!= include('Styled_Branding_CSS'); ?>
</head>
<body>

<div class="container">
    <div class="header-panel">
        <h1 class="brand-name"></h1>
        <h2>Custom Session Data Entry</h2>
    </div>

    <div id="loadingMsg" style="text-align:center; padding:30px; color:#64748b;">
        🔄 Loading session columns...
    </div>

    <div id="mainForm" style="display:none;">
        
        <!-- Session Info -->
        <div class="section-box" style="background:#f0fdf4; border:1px solid #bbf7d0; margin-bottom:16px;">
            <div style="font-weight:700; color:#15803d; font-size:13px;">📋 Session: <span id="sessionNameDisplay"></span></div>
            <div style="font-size:12px; color:#64748b; margin-top:4px;">Coach: <span id="coachEmailDisplay"></span></div>
        </div>

        <!-- Dynamic Form Fields -->
        <div class="section-box">
            <h3 style="margin-top:0;">Player Data Entry</h3>

            <div class="form-group" style="margin-bottom:14px;">
                <label style="font-weight:600; color:#334155;">Filter by Center (optional)</label>
                <select id="customSessionCenterFilter" onchange="populateCustomSessionBatchFilter(); populateCustomSessionStudentOptions();"
                    style="width:100%; padding:10px; border-radius:8px; border:1px solid #cbd5e1; font-size:14px; margin-top:4px; box-sizing:border-box;">
                    <option value="">-- All Centers --</option>
                </select>
            </div>

            <div class="form-group" style="margin-bottom:14px;">
                <label style="font-weight:600; color:#334155;">Filter by Batch (optional)</label>
                <select id="customSessionBatchFilter" onchange="populateCustomSessionStudentOptions();"
                    style="width:100%; padding:10px; border-radius:8px; border:1px solid #cbd5e1; font-size:14px; margin-top:4px; box-sizing:border-box;">
                    <option value="">-- All Batches --</option>
                </select>
            </div>

            <div class="form-group" style="margin-bottom:14px;">
                <label style="font-weight:600; color:#334155;">Player Name *</label>
                <select id="field_Player_Name" disabled
                    style="width:100%; padding:10px; border-radius:8px; border:1px solid #cbd5e1; font-size:14px; margin-top:4px; box-sizing:border-box;">
                    <option value="">Loading roster...</option>
                </select>
            </div>

            <input type="hidden" id="field_Trial_Number_Or_Bib">

            <div id="dynamicFieldsContainer"></div>
        </div>

        <!-- Submit Button -->
        <button class="master-action-btn btn-commit" style="margin-top:16px;" onclick="submitCustomEntry()">
    ✅ Save Entry
          </button>

        <button class="master-action-btn" style="margin-top:10px; background:#475569; color:white;" onclick="goBack()">
            ← Back to Evaluation Engine
        </button>

    </div>

    <div id="errorMsg" style="display:none; text-align:center; padding:30px; color:#dc2626; font-weight:600;"></div>
</div>




<script>
    let sessionName = '';
    let sheetColumns = [];
    let coachEmail = '';
    let isDemoMode = false;
  
    const HIDDEN_COLUMNS = ['TX_Signature_Token', 'Student_ID'];
    const LOCKED_COLUMNS = ['Player_Name', 'Trial_Number_Or_Bib'];
const DEPLOYED_BASE_URL = '<?!= deployedUrl ?>';

function navigateToApp(appName) {
    const baseUrl = DEPLOYED_BASE_URL || window.top.location.href.split('?')[0];
    let url = baseUrl + '?app=' + appName;
    const isDemoMode = localStorage.getItem('kemp_suite_verified_demo_mode') === 'true';
    if (isDemoMode) url += '&demo=true';
    window.top.location.href = url;
}
function goBackInApp() {
    window.top.close();
    // If the browser blocked the close (e.g. this tab wasn't opened via script),
    // fall back to navigating to the Evaluation Engine instead of doing nothing.
    setTimeout(function() {
        navigateToApp('eval');
    }, 300);
}

function goBack() {
    goBackInApp();
}   // Get URL params
    (function() {
       const urlParams = new URLSearchParams(window.location.search);
sessionName = urlParams.get('session') || '<?!= urlSessionName ?>';
coachEmail = urlParams.get('coach') || localStorage.getItem('kemp_suite_verified_session_email') || '';
isDemoMode = (urlParams.get('demo') === 'true') || ('<?!= urlIsDemoMode ?>' === 'true');
const pageMode = '<?!= urlPageMode ?>';

        if (!sessionName) {
            showError("No session specified. Please go back and select a session.");
            return;
        }

        document.getElementById('sessionNameDisplay').innerText = sessionName;
        document.getElementById('coachEmailDisplay').innerText = coachEmail;

// Load columns from sheet
        google.script.run
            .withSuccessHandler(function(columns) {
                if (!columns || columns.length === 0) {
                    showError("No columns found for this session. Please check the sheet.");
                    return;
                }
                sheetColumns = columns.filter(function(c) {
                    return HIDDEN_COLUMNS.indexOf(c) === -1 && LOCKED_COLUMNS.indexOf(c) === -1;
                });
                buildForm(sheetColumns);
                if (pageMode === 'manage') {
                    buildManageSection(columns);
                }
                document.getElementById('loadingMsg').style.display = 'none';
                document.getElementById('mainForm').style.display = 'block';
            })
            .withFailureHandler(function(err) {
                showError("Failed to load session: " + err);
            })
            .getCustomSessionColumns(sessionName, isDemoMode);
    })();

    // ===== Roster dropdown for Player Name (added — reuses existing roster fetch) =====
    let customSessionRoster = [];
    let customSessionFacilities = [];
    let customSessionBatches = [];

    (function() {
        google.script.run
            .withSuccessHandler(function(ctx) {
                customSessionRoster = (ctx && ctx.players) ? ctx.players.filter(function(p) { return p.Status === 'Active'; }) : [];
                customSessionFacilities = (ctx && ctx.facilities) ? ctx.facilities : [];
                customSessionBatches = (ctx && ctx.batches) ? ctx.batches : [];

                const centerSel = document.getElementById('customSessionCenterFilter');
                centerSel.innerHTML = '<option value="">-- All Centers --</option>';
                customSessionFacilities.forEach(function(c) {
                    centerSel.innerHTML += `<option value="${c.Center_ID}">${c.Center_Name}</option>`;
                });

                populateCustomSessionStudentOptions();
            })
            .withFailureHandler(function() {
                const studentSel = document.getElementById('field_Player_Name');
                studentSel.innerHTML = '<option value="">-- Failed to load roster --</option>';
            })
            .getPerformanceEngineContext(isDemoMode, coachEmail);
    })();

    function populateCustomSessionBatchFilter() {
        const centerVal = document.getElementById('customSessionCenterFilter').value;
        const batchSel = document.getElementById('customSessionBatchFilter');
        batchSel.innerHTML = '<option value="">-- All Batches --</option>';
        customSessionBatches
            .filter(function(b) { return !centerVal || b.Center_ID === centerVal; })
            .forEach(function(b) {
                batchSel.innerHTML += `<option value="${b.Batch_ID}">${b.Batch_Name}</option>`;
            });
    }

    function populateCustomSessionStudentOptions() {
        const centerVal = document.getElementById('customSessionCenterFilter').value;
        const batchVal = document.getElementById('customSessionBatchFilter').value;
        const studentSel = document.getElementById('field_Player_Name');

        const filtered = customSessionRoster.filter(function(p) {
            if (centerVal && p.Academy_Center_ID !== centerVal) return false;
            if (batchVal && p.Academy_Batch_ID !== batchVal) return false;
            return true;
        });

        studentSel.innerHTML = '<option value="">-- Select Player --</option>';
        filtered.forEach(function(p) {
            studentSel.innerHTML += `<option value="${p.Student_ID}">${p.First_Name} ${p.Last_Name} (${p.Student_ID})</option>`;
        });
        studentSel.disabled = false;
    }

    function buildForm(columns) {
    const container = document.getElementById('dynamicFieldsContainer');
    let html = '';
    const todayStr = new Date().toISOString().split('T')[0]; // yyyy-MM-dd, matches <input type="date">

    columns.forEach(function(col) {
        if (col === 'Session_Date') {
            html += `
            <div class="form-group" style="margin-bottom:14px;">
                <label style="font-weight:600; color:#334155;">Session Date *</label>
                <input type="date" id="field_${col.replace(/\s+/g, '_')}"
                    value="${todayStr}"
                    style="width:100%; padding:10px; border-radius:8px; border:1px solid #cbd5e1; font-size:14px; margin-top:4px; box-sizing:border-box;">
            </div>`;
        } else {
            html += `
            <div class="form-group" style="margin-bottom:14px;">
                <label style="font-weight:600; color:#334155;">${col}</label>
                <input type="text" id="field_${col.replace(/\s+/g, '_')}"
                    placeholder="Enter ${col}"
                    style="width:100%; padding:10px; border-radius:8px; border:1px solid #cbd5e1; font-size:14px; margin-top:4px; box-sizing:border-box;">
            </div>`;
        }
        
    });
    container.innerHTML = html;
}

    function submitCustomEntry() {
    const selectedStudentId = document.getElementById('field_Player_Name').value;

    if (!selectedStudentId) {
        alert("Please select a Player before saving.");
        return;
    }

    const bibNumber = selectedStudentId; // Trial_Number_Or_Bib now auto-filled with Student_ID
    document.getElementById('field_Trial_Number_Or_Bib').value = bibNumber;

    const selectedStudent = customSessionRoster.find(function(p) { return p.Student_ID === selectedStudentId; });
    const playerName = selectedStudent ? (selectedStudent.First_Name + ' ' + selectedStudent.Last_Name) : '';

    // NEW — Session_Date is mandatory when this session has that column.
    // Guarded with `sessionDateEl &&` so old sessions without this column
    // (not yet backfilled) don't break — same graceful pattern used elsewhere.
    var sessionDateEl = document.getElementById('field_Session_Date');
    if (sessionDateEl && !sessionDateEl.value) {
        alert("Please select a Session Date before saving.");
        return;
    }

    const rowData = {};
    rowData['TX_Signature_Token'] = 'TX_CUSTOM_' + new Date().getTime();
    rowData['Player_Name'] = playerName;
    rowData['Trial_Number_Or_Bib'] = bibNumber;

    sheetColumns.forEach(function(col) {
        const fieldId = 'field_' + col.replace(/\s+/g, '_');
        const el = document.getElementById(fieldId);
        const val = el ? el.value.trim() : '';
        rowData[col] = val;
    });

    const btn = document.querySelector('.master-action-btn.btn-commit');
    btn.disabled = true;
    btn.innerText = "Saving...";

    google.script.run
        .withSuccessHandler(function(result) {
            btn.disabled = false;
            btn.innerText = "✅ Save Entry";
            if (result.success) {
                alert("Entry saved successfully!");
                // Reset form for next player
                const todayStr = new Date().toISOString().split('T')[0];
                document.getElementById('field_Player_Name').value = '';
                document.getElementById('field_Trial_Number_Or_Bib').value = '';
                sheetColumns.forEach(function(col) {
                    const fieldId = 'field_' + col.replace(/\s+/g, '_');
                    const el = document.getElementById(fieldId);
                    if (!el) return;
                    el.value = (col === 'Session_Date') ? todayStr : '';
                });
            } else {
                alert("Error: " + result.error);
            }
        })
        .withFailureHandler(function() {
            btn.disabled = false;
            btn.innerText = "✅ Save Entry";
            alert("Connection failed. Please try again.");
        })
        .saveCustomSessionEntry(sessionName, rowData, coachEmail, isDemoMode);
}
function toggleManageMode() {
    const url = new URL(window.location.href);
    const current = url.searchParams.get('mode');
    if (current === 'manage') {
        url.searchParams.delete('mode');
    } else {
        url.searchParams.set('mode', 'manage');
    }
    window.location.href = url.toString();
}
    function goBack() {
    goBackInApp();
}
function toggleManageMode() {
    const urlParams = new URLSearchParams(window.location.search);
    const currentMode = urlParams.get('mode') || 'entry';
    const nextMode = currentMode === 'manage' ? 'entry' : 'manage';

    const deployedUrl = '<?!= deployedUrl ?>';
    const targetUrl = deployedUrl
        + '?app=custom_session'
        + '&session=' + encodeURIComponent(sessionName)
        + '&coach=' + encodeURIComponent(coachEmail)
        + '&demo=' + (isDemoMode ? 'true' : 'false')
        + '&mode=' + nextMode;

    window.top.location.href = targetUrl;
}
    function showError(msg) {
        document.getElementById('loadingMsg').style.display = 'none';
        document.getElementById('errorMsg').innerText = msg;
        document.getElementById('errorMsg').style.display = 'block';
    }


function buildManageSection(columns) {
    const container = document.getElementById('dynamicFieldsContainer');
    
    // Add manage section above the form
    const manageHtml = `
    <div class="manage-columns-block" style="background:#fefce8; border:1px solid #fef08a; border-radius:10px; padding:14px; margin-bottom:16px;">
        <div style="font-weight:700; color:#92400e; font-size:13px; margin-bottom:10px;">⚙️ Manage Columns</div>
        
        <div style="font-weight:600; font-size:12px; color:#475569; margin-bottom:8px;">CURRENT COLUMNS</div>
        <div id="manageColumnsList" style="display:flex; flex-wrap:wrap; gap:6px; margin-bottom:12px;">
            ${columns.map(col => `
                <div style="background:white; border:1px solid #cbd5e1; border-radius:6px; padding:4px 10px; font-size:12px; font-weight:600; color:#334155; display:flex; align-items:center; gap:6px;">
                    ${col}
                    <span onclick="removeColumnFromSession('${col}')" style="cursor:pointer; color:#dc2626; font-weight:700;">✕</span>
                </div>
            `).join('')}
        </div>

        <div style="font-weight:600; font-size:12px; color:#475569; margin-bottom:8px;">ADD NEW COLUMN GROUP</div>
        <input type="text" id="manageBaseNameInput" placeholder="Main header, e.g. Speed"
            style="width:100%; padding:8px; border-radius:8px; border:1px solid #cbd5e1; font-size:13px; box-sizing:border-box;">

        <div id="manageSubLabelBuilder" style="display:none; margin-top:10px; padding:10px; background:white; border:1px dashed #cbd5e1; border-radius:8px;">
            <div style="font-size:11px; font-weight:600; color:#64748b; margin-bottom:6px;">SUB-COLUMNS UNDER "<span id="manageBaseNamePreview"></span>" (optional)</div>
            <div style="display:flex; gap:8px;">
                <input type="text" id="manageSubLabelInput" placeholder="e.g. No Pressure, Under Pressure, Notes"
                    style="flex:1; padding:8px; border-radius:8px; border:1px solid #cbd5e1; font-size:13px;"
                    onkeydown="if(event.key==='Enter'){event.preventDefault(); addManageSubLabel();}">
                <button onclick="addManageSubLabel()"
                    style="padding:8px 14px; border-radius:8px; border:none; background:#0f172a; color:white; font-weight:700; font-size:13px; cursor:pointer;">+</button>
            </div>
            <div id="manageSubLabelChips" style="margin-top:8px; display:flex; flex-wrap:wrap; gap:6px;"></div>
        </div>

        <div style="display:flex; gap:8px; margin-top:10px;">
            <button onclick="startManageColumnGroup()"
                style="flex:1; padding:8px; border-radius:8px; border:1px solid #cbd5e1; background:white; color:#475569; font-weight:700; font-size:12px; cursor:pointer;">
                Start Group
            </button>
            <button onclick="finishManageColumnGroup()"
                style="flex:1; padding:8px; border-radius:8px; border:none; background:#16a34a; color:white; font-weight:700; font-size:12px; cursor:pointer;">
                ✓ Add to Session
            </button>
        </div>
    </div>
    <hr style="border:0; border-top:1px solid #e2e8f0; margin:16px 0;">
    <div style="font-weight:700; color:#1e293b; font-size:13px; margin-bottom:12px;">📝 Enter Player Data</div>
    `;

    container.insertAdjacentHTML('beforebegin', manageHtml);
}

function addColumnToSession() {
    const input = document.getElementById('manageNewColInput');
    const colName = input.value.trim();
    if (!colName) return;

    const btn = document.querySelector('[onclick="addColumnToSession()"]');
    if (btn) { btn.disabled = true; btn.style.opacity = '0.5'; btn.style.cursor = 'not-allowed'; }
    input.disabled = true;

    google.script.run
        .withSuccessHandler(function(result) {
            if (btn) { btn.disabled = false; btn.style.opacity = '1'; btn.style.cursor = 'pointer'; }
            input.disabled = false;
            if (result.success) {
                input.value = '';
                reloadColumnsInPlace();
            } else {
                alert("Error: " + result.error);
            }
        })
        .withFailureHandler(function() {
            if (btn) { btn.disabled = false; btn.style.opacity = '1'; btn.style.cursor = 'pointer'; }
            input.disabled = false;
            alert("Connection failed.");
        })
        .addColumnsToExistingSession(sessionName, [colName], isDemoMode);
}
//for grouping the columns and adding the columns
let managePendingBaseName = '';
let managePendingSubLabels = [];

function startManageColumnGroup() {
    const baseInput = document.getElementById('manageBaseNameInput');
    const baseName = baseInput.value.trim();
    if (!baseName) { alert("Enter a main header name first."); return; }

    managePendingBaseName = baseName;
    managePendingSubLabels = [];

    document.getElementById('manageBaseNamePreview').innerText = baseName;
    document.getElementById('manageSubLabelBuilder').style.display = 'block';
    document.getElementById('manageSubLabelChips').innerHTML = '';
    document.getElementById('manageSubLabelInput').value = '';
    document.getElementById('manageSubLabelInput').focus();
}

function addManageSubLabel() {
    const input = document.getElementById('manageSubLabelInput');
    const label = input.value.trim();
    if (!label) return;

    if (managePendingSubLabels.length >= 3) {
        alert("Maximum 3 sub-columns per group.");
        return;
    }

    const suffix = label.replace(/\s+/g, '');
    const fullName = managePendingBaseName + '_' + suffix;

    if (managePendingSubLabels.some(s => s.fullName === fullName)) {
        alert(`"${label}" already added for this group!`);
        return;
    }
    managePendingSubLabels.push({ label: label, fullName: fullName });
    input.value = '';

    const chipContainer = document.getElementById('manageSubLabelChips');
    const chip = document.createElement('div');
    chip.style.cssText = 'background:#f8fafc; border:1px solid #cbd5e1; border-radius:6px; padding:4px 10px; font-size:12px; font-weight:600; color:#334155; display:flex; align-items:center; gap:6px;';
    chip.innerHTML = `${label} <span onclick="this.parentElement.remove(); managePendingSubLabels = managePendingSubLabels.filter(s => s.fullName !== '${fullName}');" style="cursor:pointer; color:#dc2626; font-weight:700;">✕</span>`;
    chipContainer.appendChild(chip);
    input.focus();
}

function finishManageColumnGroup() {
    if (!managePendingBaseName) { alert("Click \"Start Group\" first and enter a main header."); return; }
    if (managePendingSubLabels.length === 0) { alert("Please add at least one sub-column (e.g. \"No Pressure\", \"Rating\") before adding this group."); return; }

    const namesToAdd = [managePendingBaseName];
    managePendingSubLabels.forEach(function(s) { namesToAdd.push(s.fullName); });

    const alreadyExists = namesToAdd.filter(function(n) { return sheetColumns.indexOf(n) !== -1; });
    if (alreadyExists.length > 0) {
        alert("These columns already exist: " + alreadyExists.join(', ') + ". Please choose different names.");
        return;
    }

    const btn = document.querySelector('[onclick="finishManageColumnGroup()"]');
    if (btn) { btn.disabled = true; btn.style.opacity = '0.5'; }

    google.script.run
        .withSuccessHandler(function(result) {
            if (btn) { btn.disabled = false; btn.style.opacity = '1'; }
            if (result.success) {
                managePendingBaseName = '';
                managePendingSubLabels = [];
                reloadColumnsInPlace();
            } else {
                alert("Error: " + result.error);
            }
        })
        .withFailureHandler(function() {
            if (btn) { btn.disabled = false; btn.style.opacity = '1'; }
            alert("Connection failed.");
        })
        .addColumnsToExistingSession(sessionName, namesToAdd, isDemoMode);
}
function removeColumnFromSession(colName) {
    if (!confirm("Remove column '" + colName + "'? This will delete all data in that column!")) return;

    // Find the chip for this column and show a deleting state
    const chips = document.querySelectorAll('#manageColumnsList > div');
    chips.forEach(function(chip) {
        if (chip.textContent.trim().startsWith(colName)) {
            chip.innerHTML = '⏳ Deleting...';
            chip.style.opacity = '0.6';
            chip.style.pointerEvents = 'none';
        }
    });

    google.script.run
        .withSuccessHandler(function(result) {
            if (result.success) {
                reloadColumnsInPlace();
            } else {
                alert("Error: " + result.error);
                reloadColumnsInPlace(); // restore chip state even on logical failure
            }
        })
        .withFailureHandler(function() {
            alert("Connection failed.");
            reloadColumnsInPlace(); // restore chip state on network failure too
        })
        .removeColumnFromSession(sessionName, colName, isDemoMode);
}
// Re-fetches the column list and re-renders the manage section + form,
// without a full page reload.
function reloadColumnsInPlace() {
    google.script.run
        .withSuccessHandler(function(columns) {
            if (!columns || columns.length === 0) {
                showError("No columns found for this session. Please check the sheet.");
                return;
            }
            sheetColumns = columns.filter(function(c) {
                return HIDDEN_COLUMNS.indexOf(c) === -1 && LOCKED_COLUMNS.indexOf(c) === -1;
            });

            // Nuke every trace of previously-injected manage UI, regardless of class,
            // by removing anything between the Trial Number field and dynamicFieldsContainer.
            const allInjected = document.querySelectorAll('.manage-columns-block, .manage-player-data-heading, .manage-section-hr');
            allInjected.forEach(function(el) { el.remove(); });

            document.getElementById('dynamicFieldsContainer').innerHTML = '';

            buildForm(sheetColumns);
            buildManageSection(columns);
        })
        .withFailureHandler(function(err) {
            alert("Failed to refresh columns: " + err);
        })
        .getCustomSessionColumns(sessionName, isDemoMode);
}
</script>

</body>
</html>
